name: check

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: NixOS/nix-installer-action@00b25e1d0d56f56e90ee9814fb4385c721348f74 # main, 2026-07-13
      - name: Debug - diff generated vs committed repositories.nix
        run: |
          cp nix/repositories.nix /tmp/repos-committed.nix
          nix develop .#bootstrap --command python3 tools/generate-repositories.py
          cp nix/repositories.nix /tmp/repos-generated.nix
          git checkout -- nix/repositories.nix
          echo "=== DIFF ==="
          diff -u /tmp/repos-committed.nix /tmp/repos-generated.nix || true
      - name: Validate clean-checkout source metadata
        run: |
          nix develop .#bootstrap --command python3 tools/check-source-compat.py
          nix develop .#bootstrap --command python3 tools/generate-zig-locks.py --check
      - name: Check flake
        run: |
          nix flake check --show-trace
          nix eval .#packages.aarch64-linux.otter-bar.drvPath --raw
      - name: Build representative package
        run: nix build .#otter-bar .#otter-term --show-trace
      - name: Verify release manifest
        run: nix develop .#bootstrap --command python3 tools/check-manifest.py

  aarch64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: NixOS/nix-installer-action@00b25e1d0d56f56e90ee9814fb4385c721348f74 # main, 2026-07-13
      - name: Build representative aarch64 packages
        run: nix build .#otter-bar .#otter-term --show-trace
