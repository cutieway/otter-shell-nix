name: check

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main, 2026-07-13
      - name: Free runner disk for the Nix store
        # Package builds (vendored C sources, Zig caches, debug info) need
        # several GB the stock image does not spare. None of the pruned
        # toolchains are used by Nix builds.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /
      - name: Validate clean-checkout source metadata
        run: |
          nix develop .#bootstrap --command python3 tools/pipeline.py check compat
          nix develop .#bootstrap --command python3 tools/pipeline.py lock --check
      - name: Check flake
        run: |
          nix flake check --show-trace
          nix eval .#packages.aarch64-linux.otter-bar.drvPath --raw
      - name: Build representative package (otter-bar)
        run: nix build .#otter-bar --show-trace --print-build-logs
      - name: Build representative package (otter-term)
        run: nix build .#otter-term --show-trace --print-build-logs
      - name: Verify release manifest
        run: nix develop .#bootstrap --command python3 tools/pipeline.py check manifest

  aarch64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main, 2026-07-13
      - name: Free runner disk for the Nix store
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /
      - name: Build representative aarch64 package (otter-bar)
        run: nix build .#otter-bar --show-trace --print-build-logs
      - name: Build representative aarch64 package (otter-term)
        run: nix build .#otter-term --show-trace --print-build-logs
