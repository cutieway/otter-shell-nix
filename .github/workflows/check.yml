name: check

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main, 2026-07-13
      - name: Validate clean-checkout source metadata
        run: |
          nix develop .#bootstrap --command python3 tools/pipeline.py check compat
          nix develop .#bootstrap --command python3 tools/pipeline.py lock --check
      - name: Check flake
        run: |
          nix flake check --show-trace
          nix eval .#packages.aarch64-linux.otter-bar.drvPath --raw
      - name: Build representative package
        run: nix build .#otter-bar .#otter-term --show-trace
      - name: Verify release manifest
        run: nix develop .#bootstrap --command python3 tools/pipeline.py check manifest

  aarch64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main, 2026-07-13
      - name: Build representative aarch64 packages
        run: nix build .#otter-bar .#otter-term --show-trace
